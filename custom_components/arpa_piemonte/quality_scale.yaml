rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration has no actions.
  appropriate-polling:
    status: done
    comment: >-
      Every 10 minutes, with conditional requests: Meteo 3R writes its files every
      30 minutes, and most answers are a 304. The official sources are asked only
      when Meteo 3R fails, at most every 20 or 30 minutes.
  brands:
    status: done
    comment: >-
      The icon and logo of Arpa Piemonte in the brand folder of the integration,
      read by Home Assistant 2026.3 and newer; the README states whose trademarks
      they are.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: >-
      aiometeo3r and aioarpapiemonte, on PyPI, built and published by their own
      GitHub workflows.
  docs-actions:
    status: exempt
    comment: The integration has no actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: The entities subscribe to no events; the coordinator updates them.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration has no actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The data of Arpa Piemonte is public, without authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: A cloud service, nothing to discover on the network.
  discovery:
    status: exempt
    comment: A cloud service, nothing to discover on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: A service, not a device.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: >-
      Each device is a station the user adds, as a subentry of its municipality;
      the entry reloads with it.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: >-
      The station has the entities of its sensors only; the diagnostic ones are
      few and useful to understand the readings.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Nothing the user can repair; a source that fails is replaced by another.
  stale-devices:
    status: exempt
    comment: >-
      Each device is a station the user added, as a subentry: deleting the
      subentry deletes its device and entities.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
